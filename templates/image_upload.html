<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FaceInsight - Upload Image</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel+Decorative&display=swap");

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
        background-attachment: fixed;
        color: #fff;
        font-family: "Cinzel Decorative", cursive;
        background-image: radial-gradient(
          circle,
          rgba(0, 255, 136, 0.05) 1px,
          transparent 1px
        );
        background-size: 60px 60px;
        position: relative;
        overflow-x: hidden;
      }

      .overlay {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(2px);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: #00ff88;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        color: black;
        font-size: 16px;
        cursor: pointer;
        z-index: 2;
        box-shadow: 0 0 10px #00ff88;
        text-decoration: none;
        transition: 0.3s;
      }

      .back-btn:hover {
        background: #1aff99;
        box-shadow: 0 0 20px #1aff99, 0 0 30px #1aff99;
      }

      .container {
        z-index: 1;
        text-align: center;
        padding: 40px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        max-width: 700px;
        width: 90%;
        margin: 100px auto 60px auto;
        position: relative;
      }

      h1 {
        font-size: 36px;
        color: #00ff88;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #00ff88;
      }

      form {
        margin-top: 20px;
      }

      .custom-file-upload {
        display: inline-block;
        padding: 12px 25px;
        border-radius: 10px;
        background: #1e1e1e;
        color: white;
        border: 1px solid #00ff88;
        cursor: pointer;
        margin-bottom: 20px;
        transition: 0.3s;
      }

      .custom-file-upload:hover {
        background: #2c2c2c;
        box-shadow: 0 0 10px #00ff88;
      }

      input[type="file"] {
        display: none;
      }

      .btn {
        background: #00ff88;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        color: black;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 10px #00ff88;
      }

      .btn:hover {
        background: #1aff99;
        box-shadow: 0 0 20px #1aff99, 0 0 30px #1aff99;
      }

      .footer {
        margin-top: 30px;
        font-size: 14px;
        color: #aaa;
      }

      .result {
        margin-top: 30px;
        font-size: 20px;
        color: #e0e0e0;
        text-shadow: 0 0 5px #00ff88;
      }

      .uploaded-img {
        margin-top: 20px;
        max-width: 100%;
        height: auto;
        max-height: 500px;
        display: block;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        object-fit: contain;
        margin-left: auto;
        margin-right: auto;
      }

      .error {
        color: red;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="overlay"></div>

    <a href="{% url 'home' %}" class="back-btn">← Back</a>

    <div class="container">
      <h1>Upload Image for Analysis</h1>
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label class="custom-file-upload">
          <input type="file" name="image" accept="image/*" required />
          Upload Image
        </label>
        <br />
        <button class="btn" type="submit">Check Image</button>
      </form>

      {% if prediction %}
      <div class="result">
        🧠 Detected Features: <strong>{{ prediction }}</strong>
      </div>
      {% endif %} {% if shirt_color %}
      <div class="result">
        👕 Shirt Color: <strong>{{ shirt_color }}</strong>
      </div>
      {% endif %} {% if image_url %}
      <img src="{{ image_url }}" alt="Uploaded Image" class="uploaded-img" />
      {% endif %} {% if error_message %}
      <div class="error">{{ error_message }}</div>
      {% endif %}

      <div class="footer">© 2025 FaceInsight</div>
    </div>
  </body>
</html>
